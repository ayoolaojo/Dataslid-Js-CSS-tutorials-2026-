<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetching explained..</title>
  </head>
  <body>
    <h1>Products Gallery</h1>
    <p id="loadingState"></p>
    
    <ul id="displayProducts"></ul>

    <script>
    

      const newBaseUrl = "https://fakestoreapi.com/products";
      const loadingState = document.getElementById("loadingState");
      const displayProducts = document.getElementById("displayProducts");
        let allProducts = [];
      const getProducts = async () => {
        loadingState.innerText = " Processing.....Please wait!";
        try {
          const response = await fetch(newBaseUrl);
          if (!response.ok) {
            throw new Error(`${response.statusText}`);
          }

          const products = await response.json();
          console.log(products);

          loadingState.innerText = "";

          allProducts = products;

          renderProducts(allProducts);
        } catch (error) {
          console.log(error.message);
        }
      };

      getProducts();

      const renderProducts = (products) =>  {
        displayProducts.innerHTML = "";

        products.forEach((product) => {
          const li = document.createElement("li");
          const id = document.createElement("h1");
          id.innerText = `${product.id}`;

          const title = document.createElement("h2");
          title.innerText = `${product.title}`;

          const price = document.createElement("i");
          price.innerText = `#${product.price}`;

          const description = document.createElement("p");
          description.innerText = `${product.description}`;

          const category = document.createElement("p");
          category.innerText = `${product.category}`;

          li.append(id);
          li.append(title);
          li.append(price);
          li.append(description);
          li.append(category);

          displayProducts.append(li);
        });
      };


      const postProduct = async()=> {
        try {
          const response = await fetch(newBaseUrl,{
             method: 'POST',
             headers: {
              'Content-Type':'application/json'
             },
             body: JSON.stringify({
                title: 'My-Product',
                price: 500,
                description: 'lorem ipaum',
                category: 'Random'
             })
                
             
          })
             if(!response.ok){
              throw new Error(`Product not Created : ${response.status}`)
             }

             const newProduct = await response.json()

             console.log(newProduct)
             allProducts.push(newProduct)
             renderProducts(allProducts)
        } catch (error) {
          console.log(error.message)
        }

      }

      postProduct()
    </script>
  </body>
</html>
