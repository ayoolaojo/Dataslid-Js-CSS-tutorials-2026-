<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    class="flex flex-col bg-teal-100 h-{auto} w-full items-center p-8 gap-5"
  >
    <h1 class="font-bold text-4xl">Student Tracker</h1>
    <input class="w-80 h-10 p-2 bg-white rounded-full " type="search" id="searchInput"   /> <span>&#128269</span>
    <button class="bg-green-600 text-white w-50 px-10 text-center rounded-full" id="searchBtn">Search</button>
    <ul id="studentList"></ul>
    <p id="report"></p>
    <button
      class="bg-green-600 text-white w-50 px-10 text-center rounded-full"
      id="passedStudentsBtn"
    >
      Passed Students
    </button>

    <button
      class="bg-green-600 text-white w-50 px-10 text-center rounded-full"
      id="allStudentsBtn"
    >
      All Students
    </button>

    <input id="newStudentName" type="text" placeholder="Enter student's name" />
    <input
      id="newStudentScore"
      type="number"
      placeholder="Enter student's score"
    />

    <button
      class="bg-green-600 text-white w-50 px-10 text-center rounded-full"
      id="addNewSt"
    >
      Add New Student
    </button>

    <script>
      const studentList = document.getElementById("studentList");
      const passedStudentsBtn = document.getElementById("passedStudentsBtn");
      const report = document.getElementById("report");
      const allStudentsBtn = document.getElementById("allStudentsBtn");
      const newStudentName = document.getElementById("newStudentName");
      const newStudentScore = document.getElementById("newStudentScore");
      const addNewSt = document.getElementById("addNewSt");
      const searchInput = document.getElementById("searchInput");
      const searchBtn = document.getElementById("searchBtn");

      const students = [
        { name: "Amina", score: 45 },
        { name: "Tunde", score: 82 },
        { name: "Chidi", score: 60 },
        { name: "Ngozi", score: 38 },
        { name: "Daniel", score: 97 },
        { name: "David", score: 97 },
        { name: "Emeka", score: 96 },
        { name: "Ayoola", score: 41 },
        { name: "Fawaz", score: 95 },
        { name: "Baki", score: 94 },
        { name: "Clinton", score: 93 },
        { name: "Mubarak", score: 92 },
        { name: "Bobola", score: 91 },
        { name: "Paul", score: 90 },
        { name: "Dataslid", score: 99.9 },
        { name: "Imole", score: 97 },
        { name: "Random", score: 9 },
        { name: " Lamidi", score: 81 },
      ];

     

      const passed = students.filter((student) => student.score >= 50).length;

      console.log(students);
      const renderStudents = (list) => {
        studentList.innerHTML = "";
        list.forEach((student) => {
          const li = document.createElement("li");
          li.innerText = ` ${student["name"]}  -  ${student.score} points `;
          studentList.appendChild(li);

          if (student.score >= 50) {
            li.style.color = "green";
          } else {
            li.style.color = "red";
          }
        });

    
      };

      renderStudents(students);

      const filteredStudents = () => {
        

        const passed = students.filter((student) => student.score >= 50);
        renderStudents(passed);

        report.innerText = `${passed.length} students passed out of ${students.length}`;
        report.style.color = "red";
      };

     

      passedStudentsBtn.addEventListener("click", () => {
        studentList.innerHTML = "";
        filteredStudents();
      });

      allStudentsBtn.addEventListener("click", () => {
        renderStudents(students);
      });

      

      const addNewStudent = () => {
        let nName = String(newStudentName.value).trim().toLowerCase();
        let nScore = Number(newStudentScore.value);

        if (nName === "" || isNaN(nScore) || nScore > 100) {
          alert("invalid Input");
          return;
        }

        const newStudent = {
          name: nName,
          score: nScore,
        };

        students.push(newStudent);
      };

      addNewSt.addEventListener("click", () => {
        addNewStudent();

        renderStudents(students);

        newStudentName.value = "";
        newStudentScore.value = "";
      });


      searchInput.addEventListener('keyup',()=> {
         const searchTerm = searchInput.value.trim().toLowerCase();
         const searchFilter =  students.filter((student)=>(
            student.name.toLowerCase().includes(searchTerm)
         ))
            
        
         renderStudents(searchFilter)

          report.innerText = `showing ${searchFilter.length} out of ${students.length} `
          report.style.color = 'indigo';

          

      })

      searchBtn.addEventListener('click', ()=> {
          searchInput.value = ''
      })


    </script>
  </body>
</html>
